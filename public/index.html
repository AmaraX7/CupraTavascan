<!DOCTYPE html>
<script src="scripts.js"></script>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Web Cupra Tavascan</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Know your Cupra Tavascan</h1>
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/Cupra_White.png" alt="Logo Cupra" class="logo">
        </div>
    </header>


    <nav class="tab-bar">
        <button onclick="cambiarPestaña('inicio')">Home</button>
        <button onclick="cambiarPestaña('uno')">Interior</button>
        <button onclick="cambiarPestaña('dos')">Videos</button>
        <h2>Welcome to Cupra Tavascan Experience</h2>
    </nav>

  
    <section id="response">
        <!-- Aquí aparecerán los mensajes -->
    </section>

      
      <div id="pestaña-inicio" class="pestaña activa" style="display: block;">
        
        <section id="countdown">
            <h2>Cuenta regresiva para la llegada de tu coche:</h2>
            <p id="timer">Cargando...</p>
        </section>
    </div>
      
      <div id="pestaña-uno" class="pestaña">
        <h2>Overview (left hand drive)
            
            <section>
                <div class="image-container">
                    <img src="images/parteFrontal.jpg" alt="Parte Frontal" class="dashboard-image">
                    
                    <!-- Botones flotantes -->
                    <button class="hotspot" style="top: 1.6%; left: 11.7%;" onclick="showInfo(1)">1</button>
                    <button class="hotspot" style="top: 1.6%; left: 15.5%;" onclick="showInfo(2)">2</button>
                    <button class="hotspot" style="top: 1.6%; left: 19.5%;" onclick="showInfo(3)">3</button>
                    <button class="hotspot" style="top: 1.6%; left: 28.5%;" onclick="showInfo(4)">4</button>
                    <button class="hotspot" style="top: 1.6%; left: 32.5%;" onclick="showInfo(5)">5</button>
                    <button class="hotspot" style="top: 1.6%; left: 38.4%;" onclick="showInfo(6)">6</button>
                    <button class="hotspot" style="top: 1.6%; left: 43%;" onclick="showInfo(5)">5</button>
                    <button class="hotspot" style="top: 1.6%; left: 47%;" onclick="showInfo(7)">7</button>
                    <button class="hotspot" style="top: 1.6%; left: 63.7%;" onclick="showInfo(8)">8</button>
                    <button class="hotspot" style="top: 89.7%; left: 17.6%;" onclick="showInfo(9)">9</button>
                    <button class="hotspot" style="top: 89.7%; left: 28%;" onclick="showInfo(10)">10</button>
                    <button class="hotspot" style="top: 89.7%; left: 33%;" onclick="showInfo(11)">11</button>
                    <button class="hotspot" style="top: 89.7%; left: 40%;" onclick="showInfo(12)">12</button>
                    <button class="hotspot" style="top: 89.7%; left: 67.5%;" onclick="showInfo(13)">13</button>
                </div>
                
                <div id="info-box" class="info-box">
                    Click on a number to see more information.
                </div>        
            </section>
            
        </h2>
      </div>
      
      <div id="pestaña-dos" class="pestaña" style="display: none;">
    
        <!-- Carrusel de Videos -->
        <section id="video-carousel">
            <h2>Tecnologias Tavascan</h2>
            <div class="carousel">
                <button class="prev" onclick="moveCarousel(-1)">❮</button>
                <div class="carousel-videos">
                    <iframe id="current-video" src="https://www.youtube.com/embed/Sdj9iO8opuU" frameborder="0" allowfullscreen></iframe>
                </div>
                <button class="next" onclick="moveCarousel(1)">❯</button>
            </div>
            <p id="video-description">Sistema de Aparcamiento en Línea</p>
        </section>
    </div>
      
      


    <!-- Chatbot -->
    <div id="chatbot-container">
        <div class="chat-header">
            <h3>Chatbot Cupra Tavascan</h3>
            <button id="toggle-chat">Abrir/Cerrar</button>
        </div>
        <div id="chat-body" class="chat-body">
            <div id="messages" class="messages"></div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Escribe tu pregunta...">
                <button id="send-btn">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // Mostrar mensajes de los botones
        function showMessage(message) {
            const responseSection = document.getElementById('response');
            responseSection.innerHTML = `
                <div class="message-box">
                    ${message}
                </div>
            `;
        }

        // Lógica del mapa interactivo
        function showInfo(area) {
            const infoBox = document.getElementById('info-box');
            const info = {
                1: 'Pantalla táctil de 15": Controla el sistema multimedia y la navegación.',
                2: 'Asistente de voz: Usa comandos de voz para ajustar configuraciones.',
                3: 'Panel de instrumentos digital: Muestra información clave del vehículo.',
            };
            infoBox.textContent = info[area] || 'Haz clic para ver su explicación.';
        }

        // Lógica del carrusel de videos
        const videos = [
            { url: "https://www.youtube.com/embed/Sdj9iO8opuU", description: "Introducción al Cupra Tavascan." },
            { url: "https://www.youtube.com/embed/VIDEO_ID_AQUI", description: "Características avanzadas del Cupra Tavascan." },
        ];
        let currentVideoIndex = 0;

        function moveCarousel(direction) {
            currentVideoIndex = (currentVideoIndex + direction + videos.length) % videos.length;
            document.getElementById('current-video').src = videos[currentVideoIndex].url;
            document.getElementById('video-description').textContent = videos[currentVideoIndex].description;
        }

        // Lógica del chatbot
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('toggle-chat');
            const chatBody = document.getElementById('chat-body');
            const sendBtn = document.getElementById('send-btn');
            const userInput = document.getElementById('user-input');
            const messagesContainer = document.getElementById('messages');

            if (!toggleBtn || !chatBody || !sendBtn || !userInput || !messagesContainer) {
                console.error('Error: Uno o más elementos del chatbot no se encontraron en el DOM.');
                return;
            }

            // Toggle chat window
            toggleBtn.addEventListener('click', function() {
                chatBody.classList.toggle('visible');
            });

            // Enviar mensaje
            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            function sendMessage() {
                const message = userInput.value.trim();
                if (message === '') return;

                // Añadir mensaje del usuario
                addMessage(message, 'user');
                userInput.value = '';

                // Llamar al backend
                getBotResponse(message);
            }

            function addMessage(message, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', sender);
                if (sender === 'bot-typing') {
                    messageDiv.classList.add('bot-typing');
                }
                messageDiv.textContent = message;
                messagesContainer.appendChild(messageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            async function getBotResponse(message) {
                addMessage('Escribiendo...', 'bot-typing');

                try {
                    console.log('Enviando solicitud a /api/chat con message:', message);
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ message: message }), // Asegura que envíe el campo "message"
                    });

                    console.log('Respuesta recibida:', response);
                    if (!response.ok) {
                        throw new Error(`Error HTTP: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    console.log('Datos recibidos:', data);

                    const typingMessage = document.querySelector('.bot-typing');
                    if (typingMessage) {
                        messagesContainer.removeChild(typingMessage);
                    }

                    addMessage(data.text || data.error, 'bot');
                } catch (error) {
                    console.error('Error en getBotResponse:', error);
                    const typingMessage = document.querySelector('.bot-typing');
                    if (typingMessage) {
                        messagesContainer.removeChild(typingMessage);
                    }
                    addMessage(`Error: ${error.message}`, 'bot');
                }
            }
        });
    </script>
</body>
</html>
